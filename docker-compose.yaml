services:
  mysql:
    image: mysql:8.4
    container_name: codeeval-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: codeeval
      MYSQL_USER: codeeval
      MYSQL_PASSWORD: codeeval-internal-password
      MYSQL_ROOT_PASSWORD: codeeval-root-internal-password
    ports:
      # 直接映射到宿主机公网网卡；请自行通过防火墙和安全组做好访问控制。
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  server:
    build:
      context: ./server
    container_name: codeeval-server
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      GIN_MODE: release
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      sandbox-runner:
        condition: service_healthy

  sandbox-runner:
    build:
      context: ./sandbox
      dockerfile: runner/Dockerfile
    container_name: codeeval-sandbox-runner
    restart: unless-stopped
    environment:
      RUNNER_TOKEN: codeeval-compose-internal
      # Runner 的硬上限；实际并发由 server/config.yaml 中的值控制。
      MAX_CONCURRENT_SANDBOXES: 2
      JOB_TIMEOUT_SECONDS: 180
    expose:
      - "8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      sandbox-go-image:
        condition: service_completed_successfully
      sandbox-python-image:
        condition: service_completed_successfully
      sandbox-java-image:
        condition: service_completed_successfully
      sandbox-cpp-image:
        condition: service_completed_successfully

  sandbox-go-image:
    image: codeeval-sandbox-go:local
    build: { context: ./sandbox, dockerfile: images/Dockerfile, target: go }
    entrypoint: ["/bin/true"]
  sandbox-python-image:
    image: codeeval-sandbox-python:local
    build: { context: ./sandbox, dockerfile: images/Dockerfile, target: python }
    entrypoint: ["/bin/true"]
  sandbox-java-image:
    image: codeeval-sandbox-java:local
    build: { context: ./sandbox, dockerfile: images/Dockerfile, target: java }
    entrypoint: ["/bin/true"]
  sandbox-cpp-image:
    image: codeeval-sandbox-cpp:local
    build: { context: ./sandbox, dockerfile: images/Dockerfile, target: cpp }
    entrypoint: ["/bin/true"]

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    container_name: codeeval-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mysql_data:
