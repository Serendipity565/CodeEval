services:
  mysql:
    image: mysql:8.4
    container_name: codeeval-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ${MYSQL_DATABASE:-codeeval}
      MYSQL_USER: ${MYSQL_USER:-codeeval}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    ports:
      # 直接映射到宿主机公网网卡；请自行通过防火墙和安全组做好访问控制。
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  server:
    build:
      context: ./server
    container_name: codeeval-server
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      CODEEVAL_DB_HOST: mysql
      CODEEVAL_DB_PORT: 3306
      CODEEVAL_DB_NAME: ${MYSQL_DATABASE:-codeeval}
      CODEEVAL_DB_USERNAME: ${MYSQL_USER:-codeeval}
      CODEEVAL_DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      CODEEVAL_JWT_SECRET: ${CODEEVAL_JWT_SECRET:?set CODEEVAL_JWT_SECRET in .env}
      CODEEVAL_DEEPSEEK_API_KEY: ${CODEEVAL_DEEPSEEK_API_KEY:-}
      GIN_MODE: release
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    container_name: codeeval-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mysql_data:
