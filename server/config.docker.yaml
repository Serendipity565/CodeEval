server:
  port: 8080
  cors_origins:
    - http://localhost:3000
    - http://localhost:5173
database:
  host: mysql
  port: 3306
  name: codeeval
  username: codeeval
  password: ""
  charset: utf8mb4
  max_idle_conns: 5
  max_open_conns: 20
  conn_max_lifetime_minutes: 30
jwt:
  secret: overridden-by-environment
  expires_hours: 24
seed:
  enabled: true
deepseek:
  base_url: https://api.deepseek.com
  api_key: ""
  model: deepseek-v4-flash
  timeout_seconds: 60
  max_tokens: 4096
  max_code_bytes: 100000
